<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VYXO Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&family=Monoton&family=Rubik+Glitch&family=Syne:wght@800&family=Orbitron:wght@900&family=Press+Start+2P&family=Permanent+Marker&family=Bebas+Neue&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body { margin: 0; background: #050507; color: #fff; overflow: hidden; }
      body { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
      .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
      select option, select optgroup { background: #0c0c0f; color: #fff; }
    </style>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
